# GlyphAI fleet-RCA codebook, vendor domain: Dell iDRAC message IDs, v0.3 (draft)
# (c) 2026 Vitali de Mille. Licensed under PolyForm Noncommercial 1.0.0 (see LICENSE).
#
# Road 2b: a Dell iDRAC (iDRAC9 first; iDRAC8 uses the same Event and Error Message IDs) log line
# that carries a message ID goes straight to its concept glyph. Lines without an ID still take the
# word road (L1 lexicon -> L2 phrases).
#
# Rule: an ID enters this file only with a public source that shows the ID next to its message text.
# IDs seen only in AI answers or forum guesses are left out and listed under "gaps".
# The full reference is Dell's "Event and Error Message Reference Guide" for iDRAC9; checking every
# entry against it is open work.

version: "0.3.0-dell"

concepts:
  PSU.INPUT.LOST:        {severity: crit, cause: platform, triage: check_power_feed,
                          desc: "Power supply lost its AC/DC input (feed, PDU or cable)"}
  PSU.REDUNDANCY.LOST:   {severity: warn, cause: platform, triage: check_power_feed,
                          desc: "Power supply redundancy lost: the server now runs on one feed"}
  FAN.FAIL:              {severity: crit, cause: hardware, triage: replace_fan,
                          desc: "Fan speed below the lower critical threshold"}
  THERMAL.OUT_OF_RANGE:  {severity: warn, cause: platform, triage: check_cooling,
                          desc: "A board temperature is outside its normal range"}
  VOLT.OUT_OF_RANGE:     {severity: crit, cause: hardware, triage: check_board_power,
                          desc: "A board voltage is outside its normal range"}
  DISK.PREDICTIVE_FAIL:  {severity: warn, cause: hardware, triage: replace_disk_planned,
                          desc: "Drive self-monitoring predicts failure; replace before it fails"}

message_ids:
  CPU0000: {concept: CPU.IERR.CATERR,      text: "CPU <n> has an internal error (IERR)",
            ref: "Dell community thread 'CPU1 CPU0000 Internal error (IERR)'; Dell KB 000137438 (text)"}
  CPU0704: {concept: CPU.MCE.LOGGED,       text: "CPU <n> machine check error detected",
            ref: "Dell KB 000014771 (PowerFlex dial-home alerts)"}
  MEM0001: {concept: MEM.ECC.UNCORR,       text: "Multi-bit memory errors detected on a memory device at location(s) <DIMM>",
            ref: "Dell KB 000014771"}
  MEM0702: {concept: MEM.ECC.CORR,         text: "Correctable memory error rate exceeded for <DIMM>",
            ref: "Dell KB 000014771"}
  PSU0003: {concept: PSU.INPUT.LOST,       text: "The power input for power supply <n> is lost",
            ref: "Dell KB 000014771"}
  RDU0012: {concept: PSU.REDUNDANCY.LOST,  text: "Lost PSU redundancy (front panel: RDU0012 LOST PSU REDUNDANCY CHECK PSU CABLES)",
            ref: "One Identity KB 4257127 (Dell-based appliance front panel)"}
  FAN0001: {concept: FAN.FAIL,             text: "Fan <n> RPM is less than the lower critical threshold",
            ref: "Dell KB 000014771"}
  TMP0104: {concept: THERMAL.OUT_OF_RANGE, text: "The system board <name> temperature is outside of range",
            ref: "Dell KB 000014771"}
  VLT0204: {concept: VOLT.OUT_OF_RANGE,    text: "The system board <name> voltage is outside of range",
            ref: "Dell KB 000014771"}
  NIC100:  {concept: NET.LINK.DOWN,        text: "The <controller> Port <n> network link is down",
            ref: "Dell KB 000011815 (VxRail event VXR508NIC100)"}
  PDR16:   {concept: DISK.PREDICTIVE_FAIL, text: "Predictive failure reported for <physical disk>",
            ref: "Dell KB 000011810 (VxRail event VXR508PDR16), KB 000308774"}

# Dell PCIe fatal messages already reach PCIE.FATAL by the word road ("bus" and "fatal"), with no ID:
#   "A bus fatal error was detected on a component at slot 5"                 (Dell KB 000137619)
#   "A fatal error was detected on a component at bus 2 device 0 function 0"  (Red Hat 7062084)

gaps:
  - "PCIe fatal error message ID (candidates seen in AI answers, not confirmed: PCI1302, PCI0018)"
  - "GPU-specific iDRAC messages for XE9680 / XE8640 (H100, H200) systems"
  - "PST0119, STOR0182, PDR0001, CPU0005, PSU0006: named in an AI answer, no public source found"
