# GlyphAI fleet-RCA codebook, vendor domain: Dell PowerEdge iDRAC message IDs, v0.3
# (c) 2026 Vitali de Mille. Licensed under PolyForm Noncommercial 1.0.0 (see LICENSE).
#
# Road 2b: a Dell iDRAC9 log line (Lifecycle Log, SEL text, Redfish) that carries a message ID goes
# straight to its concept glyph. Lines without an ID still take the word road (L1 lexicon -> L2 phrases).
#
# Source for every ID and text below: Dell, "PowerEdge Servers Error and Event Messages Reference Guide",
# July 2026, Rev. A00 (9,834 message IDs). 'text' is the guide's Message field; arg1, arg2... are its
# placeholders. 'dell_severity' is the guide's Severity. The concept is the GlyphAI reading of that message.
#
# Notes from checking the guide:
# - CPU0000 is "Internal error has occurred check for additional logs", severity Informational. It is not
#   mapped to CPU.IERR.CATERR; the IERR text itself still reaches that glyph by words.
# - PCI1302 is a bus time-out, not a fatal error and not a battery message. Fatal: PCI1318/PCI1358
#   ("A fatal error ... at bus/slot"), PCI1320/PCI1360 ("A bus fatal error ... at bus/slot"), PCI1363.
# - GPU events from iDRAC name a GPU by index or slot, not by PCI address, so they do not yet move the
#   per-GPU health index (which keys on bdf). Mapping slot -> bdf per platform is open work.

version: "0.3.0-dell"

