# GlyphAI fleet-RCA codebook, vendor domain: Lenovo ThinkSystem XClarity Controller (XCC) and UEFI events, v0.3
# (c) 2026 Vitali de Mille. Licensed under PolyForm Noncommercial 1.0.0 (see LICENSE).
#
# Source for every ID and text: Lenovo, "ThinkSystem SR650 V4 Messages and Codes Reference" (2026),
# chapters 2 (XClarity Controller events, FQXSP...) and 3 (UEFI events, FQXSF...). 692 IDs in the guide.
# 'text' is the guide's message string ([arg1] etc. are its placeholders); 'lenovo_severity' is its Severity.
# The concept is the GlyphAI reading of that message.
#
# Notes from checking the guide:
# - UEFI PCIe events give the address as explicit hex ("Segment 0x0 Bus 0x41 Device 0x00 Function 0x0"),
#   which the encoder turns into a bdf.
# - "Uncorrected recoverable" memory errors (FQXSFMA0056M, 0082M, 0083M) are not mapped: they are not
#   the fatal uncorrectable error and need their own concept first.
# - The SR650 V4 guide has no GPU-specific events; GPU servers (SR680a, SR780a) need their own guides.

