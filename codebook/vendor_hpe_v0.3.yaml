  - {hpe: "0005/0007", gen: 11, concept: CPU.THROTTLE, template: "CPU Throttling Triggered, CPU may be operating at a reduced performance."}
  - {hpe: "0005/0012", gen: 11, concept: CPU.THROTTLE, template: "CPU throttling detected: reduced CPU Performance"}
  - {hpe: "0005/0016", gen: 11, concept: CPU.THROTTLE, template: "CPU throttling detected, CPU may be operating at reduced performance."}
  - {hpe: "0002/002B", gen: 11, concept: THERMAL.CRIT, template: "The system is overheating due to fan issues."}
  - {hpe: "0034/0001", gen: 11, concept: PSU.FAIL, template: "Power supply %1 has exceeded the current limit. Power supply output will be disabled."}
  - {hpe: "0011/000D", gen: 11, concept: NET.LINK.DOWN, template: "All links are down in adapter %1 in slot %2"}
