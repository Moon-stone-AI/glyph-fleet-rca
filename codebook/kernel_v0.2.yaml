#
# Road 3: Linux kernel log lines (dmesg -T, journalctl -o short-iso) -> concept glyph + arguments.
# Kernel logs are mostly routine boot noise, so unmatched lines are ignored (counted), not treated as data gaps.
#
# Xid descriptions and possible-cause columns follow NVIDIA "Xid Errors" (docs.nvidia.com/deploy/xid-errors).
# Concept names follow the C_GPU_Faults taxonomy (GPU.BUS.LOST, GPU.MEM.ECC.*, LINK.NVLINK.ERROR, ...).
#
# cause: hardware | app_or_hw (application, driver or hardware; decide by fleet pattern)
#        | driver_or_hw (driver or hardware; decide by recurrence and fleet pattern) | software
#        | platform (cooling, power, fabric) | upstream (symptom of something else) | any | none

version: "0.2.0"

concepts:
  GPU.BUS.LOST:            {severity: crit, cause: hardware,  triage: drain_and_cordon, desc: "GPU has fallen off the bus (Xid 79)",
                            note: "Processes using the GPU often hang in uninterruptible sleep (state D); kill -9 and docker stop will hang too. If so, skip soft restarts: reboot or PCIe hot-plug reset"}
  GPU.MEM.ECC.DBE:         {severity: crit, cause: hardware,  triage: drain_and_cordon, desc: "Double bit ECC error (Xid 48)",
                            note: "On A100/H100/H200 often followed by Xid 95: expect the same recovery path"}
  GPU.MEM.ECC.CONTAINED:   {severity: warn, cause: hardware,  triage: restart_app_after_cleanup, desc: "Contained ECC error (Xid 94)",
                            note: "Stop the process, wait until the driver cleanup (Xid 45) is done and the GPU is available again, then restart; restarting at once on the same GPU can fail again"}
  GPU.MEM.ECC.UNCONTAINED: {severity: crit, cause: hardware,  triage: pcie_reset_or_reboot, desc: "Uncontained ECC error (Xid 95)",
                            note: "A plain GPU reset (nvidia-smi -r) often hangs or fails here; plan for a PCIe remove/rescan through sysfs or a node reboot. Processes in state D cannot be stopped softly"}
  GPU.MEM.ECC.SBE_RATE:    {severity: warn, cause: hardware,  triage: watch_rate,       desc: "High single-bit ECC error rate (Xid 92)"}
  GPU.MEM.REMAP.EVENT:     {severity: warn, cause: hardware,  triage: reset_gpu_when_idle, deadline_h: 12, then: drain_and_cordon,
                            desc: "ECC page retirement or row remapping recording event (Xid 63)",
                            note: "Long training or inference jobs never leave the GPU idle: reset when idle, but no later than the deadline; then drain the node"}
  GPU.MEM.REMAP.FAIL:      {severity: crit, cause: hardware,  triage: drain_and_cordon_then_rma, desc: "ECC page retirement or row remapper recording failure (Xid 64)",
                            note: "Spare rows are used up: take the node out of the scheduler at once and for good, then RMA; an alert alone lets user jobs keep landing on it"}
  GPU.CTRL.GSP:            {severity: crit, cause: driver_or_hw, triage: reset_gpu_then_watch, desc: "GSP RPC timeout / GSP error (Xid 119, 120)",
                            note: "Try an in-band GPU reset first. If it comes back and does not recur, treat as transient or driver; repeated on one GPU means hardware (see escalation); on many servers at once after a driver change means the driver. GSP firmware is optional on A100 in many driver branches and required on Hopper; check the driver release notes. NVIDIA's catalog lists hardware, driver, memory, bus, thermal and framebuffer causes for Xid 119/120, not user applications"}
  GPU.UCODE.HALT:          {severity: crit, cause: hardware,  triage: reset_gpu_now,    desc: "Internal micro-controller halt (Xid 62)"}
  GPU.UCODE.WARN:          {severity: warn, cause: hardware,  triage: observe,          desc: "Internal micro-controller breakpoint/warning (Xid 61)"}
  GPU.EXEC.EXCEPTION:      {severity: warn, cause: app_or_hw, triage: return_logs_to_user, desc: "Engine exception, MMU fault, push buffer or channel error (Xid 13, 31, 32, 43, 68, 69)",
                            note: "Most often a bug in user code (out-of-bounds access in custom CUDA kernels, memory leaks). Do not punish the node with a reset; reset only if the process is stuck in uninterruptible sleep (state D)"}
  GPU.DRIVER.CLEANUP:      {severity: info, cause: upstream,  triage: observe,          desc: "Preemptive cleanup due to previous errors (Xid 45)",
                            note: "Alone, with no earlier GPU error on the same GPU, it is a lagging sign of a hidden exception whose log line was lost: run a health check (nvidia-smi -q) on that GPU. After a crash, check nvidia-smi --query-compute-apps for ghost processes before new work lands: leaked contexts make new jobs fail with CUDA out-of-memory or initialization errors"}
  GPU.XID.OTHER:           {severity: warn, cause: app_or_hw, triage: look_up_xid,      desc: "Xid not yet in this codebook (see xid argument)"}
  LINK.NVLINK.ERROR:       {severity: warn, cause: hardware,  triage: run_diagnostics,  desc: "NVLink error (Xid 74)"}
  LINK.NVSWITCH.ERROR:     {severity: warn, cause: hardware,  triage: run_diagnostics,  desc: "NVSwitch error (SXid)"}
  CPU.MCE.LOGGED:          {severity: warn, cause: hardware,  triage: decode_mce,       desc: "Machine check logged by the kernel"}
  PCIE.UNCORR.NONFATAL:    {severity: warn, cause: hardware,  triage: check_link,       desc: "PCIe uncorrected non-fatal error (AER)",
                            note: "A failing slot or riser can log tens of thousands of AER messages per second and lock the host while it writes logs; rate-limit AER logging and isolate the node (see AER storm)"}
  OS.SOFT_LOCKUP:          {severity: warn, cause: any,       triage: read_stack,       desc: "CPU soft lockup"}
  OS.HUNG_TASK:            {severity: warn, cause: any,       triage: read_stack,       desc: "Task blocked for too long"}
  FABRIC.MANAGER.DOWN:     {severity: crit, cause: platform,  triage: drain_and_cordon,
                            desc: "nvidia-fabricmanager service failed",
                            note: "GPUs are fine, but multi-node jobs hang at the first collective (AllReduce) with no Xid. Drain the node at once"}
  HOST.IOMMU.FAULT:        {severity: crit, cause: platform,  triage: reboot,
                            desc: "IOMMU / DMA remapping fault (DMAR, AMD-Vi)",
                            note: "With GPUDirect RDMA or GPUDirect Storage, data from NICs or NVMe into GPU memory stalls; the GPU pipeline locks with no Xid"}
  GPU.INIT.FAIL:           {severity: crit, cause: hardware,  triage: check_retirement_records_then_reinit,
                            desc: "GPU driver failed to initialise the adapter (RmInitAdapter failed)",
                            note: "After an uncontrolled reboot during a page retirement, the retirement record can be inconsistent and the driver fails to start (sometimes with Xid 62). Where the record lives depends on GPU generation and deployment: check NVIDIA documentation before clearing anything"}
  OS.OOM:                  {severity: warn, cause: software,  triage: check_application, desc: "Out of memory, process killed"}
  THERMAL.THROTTLE:        {severity: warn, cause: platform,  triage: check_cooling,    desc: "CPU clock throttled by temperature"}

# Rate escalation: a light triage repeated too often on one GPU means the hardware is degrading.
# Counted per server and GPU (bdf) inside a sliding 24 h window.
escalation:
  - {concept: GPU.MEM.ECC.CONTAINED, max_per_day: 3, to: drain_and_cordon_and_diagnose}
  - {concept: GPU.MEM.REMAP.EVENT,   max_per_day: 3, to: drain_and_cordon_and_diagnose}
  - {concept: GPU.CTRL.GSP,          max_per_day: 1, to: drain_and_cordon_and_diagnose}

# AER storm: this many PCIe AER messages from one server inside the window -> isolate the node.
aer_storm: {per_window: 1000, window_s: 60}

# Practitioner review of the triage and notes above: Vitali de Mille, from his records, 16 Oct 2026.

# Xid number -> concept
xid:
  13: GPU.EXEC.EXCEPTION
  31: GPU.EXEC.EXCEPTION
  32: GPU.EXEC.EXCEPTION
  43: GPU.EXEC.EXCEPTION
  45: GPU.DRIVER.CLEANUP
  48: GPU.MEM.ECC.DBE
  61: GPU.UCODE.WARN
  62: GPU.UCODE.HALT
  63: GPU.MEM.REMAP.EVENT
  64: GPU.MEM.REMAP.FAIL
  68: GPU.EXEC.EXCEPTION
  69: GPU.EXEC.EXCEPTION
  74: LINK.NVLINK.ERROR
  79: GPU.BUS.LOST
  92: GPU.MEM.ECC.SBE_RATE
  94: GPU.MEM.ECC.CONTAINED
  95: GPU.MEM.ECC.UNCONTAINED
  119: GPU.CTRL.GSP
  120: GPU.CTRL.GSP

# Ordered rules: first match wins. Named groups become arguments (bdf, cpu, dimm, xid, sxid).
kernel:
  - {name: xid,      re: 'NVRM: Xid \((?:PCI:)?(?P<gpu>[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}(?:\.[0-7])?)\): (?P<xid>\d+)', concept: XID}
  - {name: sxid,     re: 'SXid \((?:PCI:)?(?P<gpu>[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}(?:\.[0-7])?)\): (?P<sxid>\d+)', concept: LINK.NVSWITCH.ERROR}
  - {name: panic,    re: 'Kernel panic - not syncing', concept: OS.KERNEL.PANIC}
  - {name: mce,      re: 'mce: \[Hardware Error\]', concept: CPU.MCE.LOGGED}
  - {name: edac_ue,  re: 'EDAC MC\d+: \d+ UE ', concept: MEM.ECC.UNCORR}
  - {name: edac_ce,  re: 'EDAC MC\d+: \d+ CE ', concept: MEM.ECC.CORR}
  - {name: aer_fat,  re: 'PCIe Bus Error: severity=Uncorrected \(Fatal\)', concept: PCIE.FATAL}
  - {name: aer_nf,   re: 'PCIe Bus Error: severity=Uncorrected \(Non-Fatal\)', concept: PCIE.UNCORR.NONFATAL}
  - {name: aer_ce,   re: 'PCIe Bus Error: severity=Corrected', concept: PCIE.CORR}
  - {name: pciehp,   re: 'pciehp: Slot\(.*\): Link Down', concept: PCIE.LINK.DOWN}
  - {name: lockup,   re: 'BUG: soft lockup', concept: OS.SOFT_LOCKUP}
  - {name: hung,     re: 'blocked for more than \d+ seconds', concept: OS.HUNG_TASK}
  - {name: oom,      re: 'Out of memory: Killed process', concept: OS.OOM}
  - {name: throttle, re: 'temperature above threshold, cpu clock throttled', concept: THERMAL.THROTTLE}
  - {name: iommu,    re: 'DMAR: DRHD: handling fault|DMAR: \[DMA (?:Read|Write)|AMD-Vi: Event logged \[IO_PAGE_FAULT', concept: HOST.IOMMU.FAULT}
  - {name: initfail, re: 'NVRM: GPU (?P<gpu>[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}(?:\.[0-7])?): RmInitAdapter failed', concept: GPU.INIT.FAIL}
  - {name: fabricmgr, re: 'nvidia-fabricmanager(?:\.service)?: (?:Main process exited, code=\w+, status=[1-9]|Failed with result)|Failed to start .*[Ff]abric ?[Mm]anager', concept: FABRIC.MANAGER.DOWN}
  - {name: netdown,  re: '(?:mlx5_core|\bib\d|\beth\d|\bens\w+).*(?:Link DOWN|Link down|link down|lost carrier)', concept: NET.LINK.DOWN}
